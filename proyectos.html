<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Proyectos</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; padding: 20px; transition: 0.3s; }
        .contenedor { max-width: 900px; margin: 0 auto; }
        .tarjeta { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.3s; }
        h2, h3 { color: #333; margin-top: 0; transition: 0.3s; }
        h2 { border-bottom: 2px solid #0056b3; padding-bottom: 10px; }
        
        input, select, button { padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; transition: 0.3s; }
        input[type="text"], select { width: 100%; box-sizing: border-box; }
        
        button { background-color: #0056b3; color: white; border: none; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
        button:hover { background-color: #004494; }
        .btn-accion { background-color: #28a745; width: auto; padding: 10px 20px; }
        .btn-accion:hover { background-color: #218838; }
        .btn-peligro { background-color: #dc3545; font-size: 18px; padding: 15px; margin-top: 20px; }
        .btn-peligro:hover { background-color: #c82333; }

        .fila-agregar { display: flex; gap: 10px; align-items: center; margin-top: 15px; }
        .fila-agregar select { flex-grow: 2; }
        .fila-agregar input { width: 100px; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; transition: 0.3s; }
        th { background-color: #6c757d; color: white; }
        
        .mensaje { padding: 10px; margin-top: 15px; border-radius: 5px; display: none; font-weight: bold; text-align: center; }
        .exito { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>

    <!-- ================= INICIO MODO OSCURO ================= -->
    <style>
        body.dark-mode { background-color: #121212; color: #e0e0e0; }
        body.dark-mode .contenedor, 
        body.dark-mode .tarjeta, 
        body.dark-mode .modal-contenido { background-color: #1e1e2d; color: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        body.dark-mode h2, body.dark-mode h3 { color: #4da3ff; border-bottom-color: #0f3460; }
        body.dark-mode th { background-color: #0f3460; color: white; border-bottom: none; }
        body.dark-mode td { border-bottom-color: #2a2a35; }
        body.dark-mode tr:hover { background-color: #2a2a35; }
        body.dark-mode input, body.dark-mode select { background-color: #2a2a35; color: white; border: 1px solid #444; }
        body.dark-mode input:focus, body.dark-mode select:focus { border-color: #4da3ff; }
        body.dark-mode .exito { background-color: #1b4332; color: #74c69d; border-color: #2d6a4f; }
        body.dark-mode .error { background-color: #5c1a1b; color: #ff9999; border-color: #8a2527; }
    </style>
    <script>
        if (localStorage.getItem('tema') === 'oscuro') {
            document.documentElement.classList.add('dark-mode');
            document.body.classList.add('dark-mode');
        }
        window.addEventListener('message', (event) => {
            if (event.data.tema === 'oscuro') {
                document.body.classList.add('dark-mode');
            } else if (event.data.tema === 'claro') {
                document.body.classList.remove('dark-mode');
            }
        });
    </script>
    <!-- ================= FIN MODO OSCURO ================= -->
</head>
<body>

<div class="contenedor">
    <h2>🛠️ Gestión de Proyectos (BOM)</h2>

    <div class="tarjeta">
        <h3>1. Crear Nuevo Proyecto</h3>
        <input type="text" id="nombreProyecto" placeholder="Ej: Controlador de Motor DC a Pasos">
        <button onclick="crearProyecto()">Crear Proyecto</button>
    </div>

    <div class="tarjeta">
        <h3>2. Lista de Materiales</h3>
        <select id="selectProyecto" onchange="cargarMateriales()">
            <option value="">-- Selecciona un proyecto para ver/editar --</option>
        </select>

        <div class="fila-agregar">
            <select id="selectComponente">
                <option value="">-- Selecciona un componente del stock --</option>
            </select>
            <input type="number" id="cantidadReq" placeholder="Cant." min="1" value="1">
            <button class="btn-accion" onclick="agregarComponenteABom()">Añadir</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Componente (MPN)</th>
                    <th>Cantidad Requerida</th>
                </tr>
            </thead>
            <tbody id="cuerpoBom">
                <tr><td colspan="2" style="text-align:center;">Selecciona un proyecto arriba.</td></tr>
            </tbody>
        </table>

        <button class="btn-peligro" onclick="ensamblarProyecto()">🚀 ENSAMBLAR PROYECTO (Restar de Inventario)</button>
        <div id="mensajeNotificacion" class="mensaje"></div>
    </div>
</div>

<script>
    const API_URL = 'https://electro-api-backend.onrender.com';

    function mostrarMensaje(texto, esError = false) {
        const div = document.getElementById("mensajeNotificacion");
        div.textContent = texto;
        div.style.display = "block";
        div.className = esError ? "mensaje error" : "mensaje exito";
        setTimeout(() => div.style.display = "none", 4000);
    }

    async function inicializarPagina() {
        try {
            const resComp = await fetch(`${API_URL}/componentes`);
            const componentes = await resComp.json();
            const selectComp = document.getElementById("selectComponente");
            componentes.forEach(c => {
                selectComp.innerHTML += `<option value="${c.id}">${c.mpn} - ${c.nombre} (Stock: ${c.stock})</option>`;
            });

            const resProy = await fetch(`${API_URL}/proyectos`);
            const proyectos = await resProy.json();
            const selectProy = document.getElementById("selectProyecto");
            proyectos.forEach(p => {
                selectProy.innerHTML += `<option value="${p.id}">${p.nombre}</option>`;
            });
        } catch (e) {
            console.error("Error cargando datos:", e);
        }
    }

    async function crearProyecto() {
        const nombre = document.getElementById("nombreProyecto").value;
        if(!nombre) return alert("Escribe un nombre.");

        try {
            const res = await fetch(`${API_URL}/proyectos`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nombre: nombre })
            });
            if(res.ok) {
                mostrarMensaje("Proyecto creado. Recarga la página para verlo en la lista.");
                document.getElementById("nombreProyecto").value = "";
            }
        } catch(e) {
            mostrarMensaje("Error al crear el proyecto.", true);
        }
    }

    async function agregarComponenteABom() {
        const proyectoId = document.getElementById("selectProyecto").value;
        const componenteId = document.getElementById("selectComponente").value;
        const cantidad = document.getElementById("cantidadReq").value;

        if(!proyectoId || !componenteId || cantidad < 1) {
            return alert("Selecciona un proyecto, un componente y una cantidad válida.");
        }

        try {
            const res = await fetch(`${API_URL}/lista_materiales`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    proyecto_id: parseInt(proyectoId), 
                    componente_id: parseInt(componenteId), 
                    cantidad: parseInt(cantidad) 
                })
            });
            
            if(res.ok) {
                cargarMateriales();
                mostrarMensaje("Componente añadido al BOM.");
            }
        } catch(e) {
            mostrarMensaje("Error al añadir componente.", true);
        }
    }

    async function cargarMateriales() {
        const proyectoId = document.getElementById("selectProyecto").value;
        const cuerpo = document.getElementById("cuerpoBom");
        
        if(!proyectoId) {
            cuerpo.innerHTML = '<tr><td colspan="2" style="text-align:center;">Selecciona un proyecto arriba.</td></tr>';
            return;
        }

        try {
            const res = await fetch(`${API_URL}/lista_materiales/${proyectoId}`);
            const materiales = await res.json();
            
            cuerpo.innerHTML = "";
            if(materiales.length === 0) {
                cuerpo.innerHTML = '<tr><td colspan="2" style="text-align:center;">No hay componentes en este proyecto aún.</td></tr>';
                return;
            }

            materiales.forEach(m => {
                cuerpo.innerHTML += `<tr>
                    <td><strong>${m.mpn}</strong> (${m.nombre})</td>
                    <td>${m.cantidad_necesaria}</td>
                </tr>`;
            });
        } catch (e) {
            cuerpo.innerHTML = '<tr><td colspan="2" style="text-align:center; color:red;">Error cargando materiales.</td></tr>';
        }
    }

    async function ensamblarProyecto() {
        const proyectoId = document.getElementById("selectProyecto").value;
        if(!proyectoId) return alert("Selecciona el proyecto que deseas ensamblar.");

        const confirmar = confirm("¿Estás seguro? Esto restará permanentemente los componentes de tu inventario general.");
        if(!confirmar) return;

        try {
            const res = await fetch(`${API_URL}/ensamblar_proyecto/${proyectoId}`, { method: "POST" });
            const data = await res.json();

            if(!res.ok) {
                mostrarMensaje("Error: " + data.detail, true);
            } else {
                mostrarMensaje("¡Éxito! " + data.mensaje);
            }
        } catch(e) {
            mostrarMensaje("Error de conexión al ensamblar.", true);
        }
    }

    window.onload = inicializarPagina;
</script>
</body>
</html>
