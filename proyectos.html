<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Proyectos</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; padding: 15px; margin: 0; transition: 0.3s; }
        .contenedor { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; transition: 0.3s; }
        h2, h3 { color: #333; margin-top: 0; }
        
        .formulario-grupo { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; flex-grow: 1; transition: 0.3s; }
        button { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; }
        
        .btn-crear { background-color: #0056b3; }
        .btn-crear:hover { background-color: #004494; }
        .btn-agregar { background-color: #28a745; }
        .btn-ensamblar { background-color: #17a2b8; width: 100%; margin-top: 10px; font-size: 16px; }
        .btn-eliminar { background-color: #dc3545; padding: 5px 10px; font-size: 12px; }
        .btn-eliminar-proy { background-color: #dc3545; float: right; }

        .grilla-proyectos { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .tarjeta-proyecto { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 15px; position: relative; transition: 0.3s; }
        
        .tabla-bom { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        .tabla-bom th, .tabla-bom td { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; transition: 0.3s; }
        .tabla-bom th { background-color: #e9ecef; }
        
        .stock-ok { color: green; font-weight: bold; }
        .stock-falta { color: red; font-weight: bold; }

        #consolaErrores { color: red; font-weight: bold; margin-bottom: 10px; }
    </style>

    <!-- ================= INICIO MODO OSCURO INDESTRUCTIBLE ================= -->
    <style>
        body.dark-mode { background-color: #121212; color: #e0e0e0; }
        body.dark-mode .contenedor { background-color: #1e1e2d; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        body.dark-mode .tarjeta-proyecto { background-color: #2a2a35; border-color: #444; }
        body.dark-mode h2, body.dark-mode h3 { color: #4da3ff; }
        body.dark-mode input, body.dark-mode select { background-color: #2a2a35; color: white; border-color: #444; }
        body.dark-mode .tabla-bom th { background-color: #0f3460; color: white; border-bottom: none; }
        body.dark-mode .tabla-bom td { border-bottom-color: #444; }
    </style>
    <script>
        function blindarModoOscuro() {
            try {
                if (window.parent && window.parent.document.body.classList.contains('dark-mode')) {
                    document.documentElement.classList.add('dark-mode');
                    if (document.body) document.body.classList.add('dark-mode');
                    return;
                }
            } catch(e) {}
            if (localStorage.getItem('tema') === 'oscuro') {
                document.documentElement.classList.add('dark-mode');
                if (document.body) document.body.classList.add('dark-mode');
            }
        }
        blindarModoOscuro();
        document.addEventListener("DOMContentLoaded", blindarModoOscuro);
        document.addEventListener("click", blindarModoOscuro);
        window.addEventListener('message', (event) => {
            if (event.data.tema === 'oscuro') {
                document.documentElement.classList.add('dark-mode');
                if (document.body) document.body.classList.add('dark-mode');
            } else if (event.data.tema === 'claro') {
                document.documentElement.classList.remove('dark-mode');
                if (document.body) document.body.classList.remove('dark-mode');
            }
        });
    </script>
    <!-- ================= FIN MODO OSCURO INDESTRUCTIBLE ================= -->
</head>
<body>

<div id="consolaErrores"></div>

<div class="contenedor">
    <h2>🛠️ Crear Nuevo Proyecto</h2>
    <div class="formulario-grupo">
        <input type="text" id="nombreProyecto" placeholder="Ej: Amplificador de Audio">
        <button class="btn-crear" onclick="crearProyecto()">Crear Proyecto</button>
    </div>
</div>

<div class="contenedor">
    <h2>➕ Agregar Componente a Proyecto</h2>
    <div class="formulario-grupo">
        <select id="selectProyecto"><option value="">Selecciona un proyecto...</option></select>
        <select id="selectComponente"><option value="">Selecciona un componente...</option></select>
        <input type="number" id="cantidadRequerida" placeholder="Cantidad" min="1" style="max-width: 100px;">
        <button class="btn-agregar" onclick="agregarComponente()">Agregar a BOM</button>
    </div>
</div>

<div class="contenedor" style="background: transparent; box-shadow: none; padding: 0;">
    <h2>📋 Mis Proyectos</h2>
    <div id="contenedorProyectos" class="grilla-proyectos">
        <p>Cargando proyectos...</p>
    </div>
</div>

<script>
    const API_URL = 'https://electro-api-backend.onrender.com';
    let componentesDisponibles = [];

    function mostrarError(mensaje) {
        document.getElementById("consolaErrores").innerHTML += `<p>❌ ${mensaje}</p>`;
    }

    async function inicializar() {
        document.getElementById("consolaErrores").innerHTML = ""; 
        
        try {
            await cargarComponentesDropdown();
        } catch (e) {
            mostrarError("Fallo al cargar la lista de componentes: " + e.message);
        }
        
        try {
            await cargarProyectos();
        } catch (e) {
            mostrarError("Fallo al cargar tus proyectos: " + e.message);
        }
    }

    async function cargarComponentesDropdown() {
        const res = await fetch(`${API_URL}/componentes`);
        if (!res.ok) {
            const txt = await res.text();
            throw new Error(`Status ${res.status} - ${txt}`);
        }
        componentesDisponibles = await res.json();
        const select = document.getElementById("selectComponente");
        select.innerHTML = '<option value="">Selecciona un componente...</option>';
        componentesDisponibles.forEach(c => {
            select.innerHTML += `<option value="${c.id}">[${c.mpn}] ${c.nombre} (Stock: ${c.stock})</option>`;
        });
    }

    async function crearProyecto() {
        const nombre = document.getElementById("nombreProyecto").value;
        if (!nombre) return alert("Ingresa un nombre");
        try {
            const res = await fetch(`${API_URL}/proyectos`, {
                method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ nombre })
            });
            if (res.ok) { document.getElementById("nombreProyecto").value = ""; cargarProyectos(); }
            else { const err = await res.text(); alert("Error al crear: " + err); }
        } catch(e) { mostrarError("Error crear proy: " + e.message); }
    }

    async function cargarProyectos() {
        const contenedor = document.getElementById("contenedorProyectos");
        const selectP = document.getElementById("selectProyecto");
        
        const res = await fetch(`${API_URL}/proyectos`);
        if (!res.ok) {
            const txt = await res.text();
            throw new Error(`Status ${res.status} - ${txt}`);
        }
        
        const proyectos = await res.json();
        selectP.innerHTML = '<option value="">Selecciona un proyecto...</option>';
        contenedor.innerHTML = "";

        if (proyectos.length === 0) {
            contenedor.innerHTML = "<p>No tienes proyectos creados aún.</p>";
            return;
        }

        for (let p of proyectos) {
            selectP.innerHTML += `<option value="${p.id}">${p.nombre}</option>`;
            
            try {
                const resBOM = await fetch(`${API_URL}/lista_materiales/${p.id}`);
                if (!resBOM.ok) throw new Error(await resBOM.text());
                
                const bom = await resBOM.json();
                let tablaHTML = `<table class="tabla-bom"><tr><th>MPN</th><th>Req.</th><th>Stock</th><th>❌</th></tr>`;
                let puedeEnsamblar = bom.length > 0;

                bom.forEach(item => {
                    let estadoStock = item.stock >= item.cantidad_necesaria ? '<span class="stock-ok">✓</span>' : '<span class="stock-falta">✗</span>';
                    if (item.stock < item.cantidad_necesaria) puedeEnsamblar = false;
                    
                    tablaHTML += `<tr>
                        <td>${item.mpn}</td>
                        <td>${item.cantidad_necesaria}</td>
                        <td>${item.stock} ${estadoStock}</td>
                        <td><button class="btn-eliminar" onclick="quitarComponente(${item.id})">X</button></td>
                    </tr>`;
                });
                tablaHTML += `</table>`;

                contenedor.innerHTML += `
                    <div class="tarjeta-proyecto">
                        <button class="btn-eliminar btn-eliminar-proy" onclick="eliminarProyecto(${p.id})">Eliminar</button>
                        <h3>${p.nombre}</h3>
                        ${bom.length === 0 ? '<p>No hay componentes aún.</p>' : tablaHTML}
                        <button class="btn-ensamblar" style="opacity: ${puedeEnsamblar ? '1' : '0.5'}; cursor: ${puedeEnsamblar ? 'pointer' : 'not-allowed'};" onclick="ensamblarProyecto(${p.id})">
                            ${puedeEnsamblar ? '🔧 Ensamblar Proyecto' : '⚠️ Stock Insuficiente'}
                        </button>
                    </div>
                `;
            } catch (eBOM) {
                contenedor.innerHTML += `<div class="tarjeta-proyecto"><p style="color:red;">Error cargando BOM de ${p.nombre}: ${eBOM.message}</p></div>`;
            }
        }
    }

    async function agregarComponente() {
        const proyecto_id = document.getElementById("selectProyecto").value;
        const componente_id = document.getElementById("selectComponente").value;
        const cantidad = document.getElementById("cantidadRequerida").value;
        
        if (!proyecto_id || !componente_id || !cantidad) return alert("Completa todos los campos");

        await fetch(`${API_URL}/lista_materiales`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ proyecto_id: parseInt(proyecto_id), componente_id: parseInt(componente_id), cantidad: parseInt(cantidad) })
        });
        document.getElementById("cantidadRequerida").value = "";
        cargarProyectos();
    }

    async function quitarComponente(item_id) {
        if(!confirm("¿Quitar componente del proyecto?")) return;
        await fetch(`${API_URL}/lista_materiales/${item_id}`, { method: "DELETE" });
        cargarProyectos();
    }

    async function eliminarProyecto(id) {
        if(!confirm("¿Eliminar proyecto y su lista de materiales?")) return;
        await fetch(`${API_URL}/proyectos/${id}`, { method: "DELETE" });
        cargarProyectos();
    }

    async function ensamblarProyecto(id) {
        if(!confirm("¿Proceder con el ensamblaje? Se descontará el stock.")) return;
        const res = await fetch(`${API_URL}/ensamblar_proyecto/${id}`, { method: "POST" });
        if (res.ok) {
            alert("Ensamblaje exitoso. Stock actualizado.");
            inicializar();
        } else {
            const err = await res.text();
            alert("Error al ensamblar: " + err);
        }
    }

    window.onload = inicializar;
</script>
</body>
</html>
