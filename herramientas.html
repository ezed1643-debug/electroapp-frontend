<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Herramientas de Electrónica</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; padding: 20px; transition: 0.3s; }
        .contenedor { max-width: 800px; margin: 0 auto; }
        .tarjeta { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.3s; }
        h2 { color: #333; border-bottom: 2px solid #0056b3; padding-bottom: 10px; transition: 0.3s; }
        input, select, button { padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; transition: 0.3s; }
        button { background-color: #0056b3; color: white; border: none; cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #004494; }
        .resultado { font-size: 18px; font-weight: bold; color: #28a745; margin-top: 15px; padding: 10px; background: #e9ecef; border-radius: 5px; transition: 0.3s;}
    </style>

    <!-- ================= INICIO MODO OSCURO ================= -->
    <style>
        body.dark-mode { background-color: #121212; color: #e0e0e0; }
        body.dark-mode .contenedor, 
        body.dark-mode .tarjeta { background-color: #1e1e2d; color: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        body.dark-mode h2 { color: #4da3ff; border-bottom-color: #0f3460; }
        body.dark-mode input, body.dark-mode select { background-color: #2a2a35; color: white; border: 1px solid #444; }
        body.dark-mode input:focus, body.dark-mode select:focus { border-color: #4da3ff; }
        body.dark-mode .resultado { background-color: #2a2a35; color: #4da3ff; }
    </style>
    <script>
        if (localStorage.getItem('tema') === 'oscuro') {
            document.documentElement.classList.add('dark-mode');
            document.body.classList.add('dark-mode');
        }
        window.addEventListener('message', (event) => {
            if (event.data.tema === 'oscuro') {
                document.body.classList.add('dark-mode');
            } else if (event.data.tema === 'claro') {
                document.body.classList.remove('dark-mode');
            }
        });
    </script>
    <!-- ================= FIN MODO OSCURO ================= -->
</head>
<body>

<div class="contenedor">
    <div class="tarjeta">
        <h2>⚡ Conversor de Capacitores</h2>
        <p>Ingresa el código de 3 dígitos (ej. 104, 473):</p>
        <input type="text" id="codigoCapacitor" placeholder="Ej: 104" maxlength="3">
        <button onclick="calcularCapacitor()">Convertir</button>
        <div id="resultadoCapacitor" class="resultado">Resultado: -</div>
    </div>

    <div class="tarjeta">
        <h2>🛠️ Calculadora de Resistencias (4 bandas)</h2>
        <select id="banda1">
            <option value="10">Marrón (1)</option>
            <option value="20">Rojo (2)</option>
            <option value="30">Naranja (3)</option>
            <option value="40">Amarillo (4)</option>
            <option value="50">Verde (5)</option>
        </select>
        <select id="banda2">
            <option value="0">Negro (0)</option>
            <option value="1">Marrón (1)</option>
            <option value="2">Rojo (2)</option>
        </select>
        <select id="multiplicador">
            <option value="1">Negro (x1)</option>
            <option value="10">Marrón (x10)</option>
            <option value="100">Rojo (x100)</option>
            <option value="1000">Naranja (x1k)</option>
        </select>
        <button onclick="calcularResistencia()">Calcular Valor</button>
        <div id="resultadoResistencia" class="resultado">Resultado: -</div>
    </div>
</div>

<script>
    function calcularCapacitor() {
        let cod = document.getElementById("codigoCapacitor").value;
        if(cod.length !== 3 || isNaN(cod)) {
            document.getElementById("resultadoCapacitor").innerHTML = "❌ Ingresa un código válido de 3 números.";
            return;
        }
        let valorBase = parseInt(cod.substring(0, 2));
        let multiplicador = Math.pow(10, parseInt(cod[2]));
        
        let pf = valorBase * multiplicador;
        let nf = pf / 1000;
        let uf = nf / 1000;
        
        document.getElementById("resultadoCapacitor").innerHTML = 
            `Valor: ${pf} pF &nbsp;|&nbsp; ${nf} nF &nbsp;|&nbsp; ${uf} µF`;
    }

    function calcularResistencia() {
        let b1 = parseInt(document.getElementById("banda1").value);
        let b2 = parseInt(document.getElementById("banda2").value);
        let mult = parseInt(document.getElementById("multiplicador").value);
        
        let valorOhmios = (b1 + b2) * mult;
        let texto = valorOhmios + " Ω";
        
        if (valorOhmios >= 1000 && valorOhmios < 1000000) {
            texto = (valorOhmios / 1000) + " kΩ";
        } else if (valorOhmios >= 1000000) {
            texto = (valorOhmios / 1000000) + " MΩ";
        }
        
        document.getElementById("resultadoResistencia").innerHTML = "Valor: " + texto;
    }
</script>
</body>
</html>
