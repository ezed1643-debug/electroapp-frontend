<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ElectroApp - Dashboard</title>
    
    <!-- Etiquetas PWA y Bloqueo estricto de Zoom en Celulares -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0056b3">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; transition: background-color 0.3s; }
        .dashboard { display: flex; height: 100vh; width: 100vw; }
        
        /* Sidebar base */
        .sidebar { width: 260px; background-color: #0056b3; color: white; display: flex; flex-direction: column; z-index: 10; transition: 0.3s; }
        .sidebar-header { padding: 20px; text-align: center; background-color: #004494; font-size: 24px; font-weight: bold; border-bottom: 1px solid #003377; transition: 0.3s; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
        .sidebar-menu li { border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-menu a { display: block; color: white; text-decoration: none; padding: 18px 20px; font-size: 16px; transition: 0.3s; }
        .sidebar-menu a:hover { background-color: #003377; border-left: 5px solid #ffc107; }
        
        /* Botón Modo Oscuro */
        .btn-oscuro { background-color: rgba(0,0,0,0.2); color: white; border: none; padding: 15px; font-size: 16px; cursor: pointer; transition: 0.3s; text-align: left; padding-left: 20px; }
        .btn-oscuro:hover { background-color: rgba(0,0,0,0.4); }

        .contenido { flex-grow: 1; background-color: #f0f2f5; position: relative; transition: 0.3s; }
        iframe { width: 100%; height: 100%; border: none; display: block; }

        /* --- REGLAS MODO OSCURO (Dashboard) --- */
        body.dark-mode .sidebar { background-color: #1a1a2e; }
        body.dark-mode .sidebar-header { background-color: #16213e; border-bottom-color: #0f3460; }
        body.dark-mode .sidebar-menu a:hover { background-color: #0f3460; }
        body.dark-mode .contenido { background-color: #121212; }
        body.dark-mode .btn-oscuro { background-color: #0f3460; }

        /* Adaptación para pantallas pequeñas (Celulares) */
        @media (max-width: 768px) {
            .dashboard { flex-direction: column; }
            .sidebar { width: 100%; height: auto; flex-direction: row; flex-wrap: wrap; }
            .sidebar-header { width: 100%; padding: 10px; font-size: 20px; }
            .sidebar-menu { display: flex; width: 100%; overflow-x: auto; }
            .sidebar-menu li { flex: 1; text-align: center; }
            .sidebar-menu a { padding: 10px; font-size: 14px; white-space: nowrap; }
            .btn-oscuro { width: 100%; text-align: center; padding: 10px; }
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="sidebar">
        <div class="sidebar-header">⚡ ElectroApp</div>
        <ul class="sidebar-menu">
            <li><a href="inventario.html" target="marco_principal">📦 Inventario</a></li>
            <li><a href="nuevo_componente.html" target="marco_principal">➕ Agregar</a></li>
            <li><a href="proyectos.html" target="marco_principal">🛠️ Proyectos</a></li>
            <li><a href="herramientas.html" target="marco_principal">🧮 Utilidades</a></li>
        </ul>
        <button class="btn-oscuro" onclick="toggleTema()" id="btnTema">🌙 Modo Oscuro</button>
    </div>

    <div class="contenido">
        <iframe name="marco_principal" id="iframePrincipal" src="inventario.html" onload="sincronizarTemaIframe()"></iframe>
    </div>
</div>

<script>
    if (localStorage.getItem('tema') === 'oscuro') {
        document.body.classList.add('dark-mode');
        document.getElementById('btnTema').innerText = "☀️ Modo Claro";
    }

    function toggleTema() {
        const esOscuro = document.body.classList.toggle('dark-mode');
        const temaActual = esOscuro ? 'oscuro' : 'claro';
        
        document.getElementById('btnTema').innerText = esOscuro ? "☀️ Modo Claro" : "🌙 Modo Oscuro";
        localStorage.setItem('tema', temaActual);
        
        sincronizarTemaIframe();
    }

    function sincronizarTemaIframe() {
        const temaActual = localStorage.getItem('tema') || 'claro';
        const iframe = document.getElementById('iframePrincipal');
        if (iframe && iframe.contentWindow) {
            iframe.contentWindow.postMessage({ tema: temaActual }, '*');
        }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registrado con éxito'))
          .catch(err => console.log('Error al registrar Service Worker:', err));
      });
    }
</script>
</body>
</html>
