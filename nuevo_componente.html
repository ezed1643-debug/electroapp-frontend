<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agregar Componente</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; padding: 20px; transition: 0.3s; margin: 0; }
        .contenedor { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.3s; box-sizing: border-box; width: 100%; }
        h2 { color: #333; border-bottom: 2px solid #0056b3; padding-bottom: 10px; transition: 0.3s; font-size: 20px; }
        label { font-weight: bold; margin-top: 10px; display: block; color: #555; }
        input { width: 100%; padding: 10px; margin: 5px 0 20px 0; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; transition: 0.3s; }
        button { background-color: #28a745; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #218838; }
        button:disabled { background-color: #6c757d; cursor: not-allowed; }
        
        .mensaje { padding: 15px; margin-top: 20px; border-radius: 5px; display: none; font-weight: bold; text-align: center; }
        .exito { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .cargando { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; display: none; text-align: center; padding: 15px; margin-top: 20px; border-radius: 5px; font-weight: bold; }
    </style>

    <!-- ================= INICIO MODO OSCURO INDESTRUCTIBLE ================= -->
    <style>
        body.dark-mode { background-color: #121212; color: #e0e0e0; }
        body.dark-mode .contenedor { background-color: #1e1e2d; color: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        body.dark-mode h2 { color: #4da3ff; border-bottom-color: #0f3460; }
        body.dark-mode input { background-color: #2a2a35; color: white; border: 1px solid #444; }
        body.dark-mode input:focus { border-color: #4da3ff; }
        body.dark-mode label { color: #aaa; }
        body.dark-mode .exito { background-color: #1b4332; color: #74c69d; border-color: #2d6a4f; }
        body.dark-mode .error { background-color: #5c1a1b; color: #ff9999; border-color: #8a2527; }
        body.dark-mode .cargando { background-color: #5a4b18; color: #fadd70; border-color: #8c7322; }
    </style>
    <script>
        function blindarModoOscuro() {
            try {
                if (window.parent && window.parent.document.body.classList.contains('dark-mode')) {
                    document.documentElement.classList.add('dark-mode');
                    if (document.body) document.body.classList.add('dark-mode');
                    return;
                }
            } catch(e) {}
            if (localStorage.getItem('tema') === 'oscuro') {
                document.documentElement.classList.add('dark-mode');
                if (document.body) document.body.classList.add('dark-mode');
            }
        }
        blindarModoOscuro();
        document.addEventListener("DOMContentLoaded", blindarModoOscuro);
        document.addEventListener("click", blindarModoOscuro);
        window.addEventListener('message', (event) => {
            if (event.data.tema === 'oscuro') {
                document.documentElement.classList.add('dark-mode');
                if (document.body) document.body.classList.add('dark-mode');
            } else if (event.data.tema === 'claro') {
                document.documentElement.classList.remove('dark-mode');
                if (document.body) document.body.classList.remove('dark-mode');
            }
        });
    </script>
    <!-- ================= FIN MODO OSCURO INDESTRUCTIBLE ================= -->
</head>
<body>

<div class="contenedor">
    <h2>➕ Agregar al Inventario (Auto-Datasheet)</h2>
    <p>Ingresa el MPN exacto. El sistema buscará el datasheet automáticamente.</p>
    
    <label>Manufacturer Part Number (MPN):</label>
    <input type="text" id="mpn" placeholder="Ej: LM358P" required>
    
    <label>Nombre descriptivo:</label>
    <input type="text" id="nombre" placeholder="Ej: Amplificador Operacional Dual" required>
    
    <label>Cantidad Inicial en Stock:</label>
    <input type="number" id="stock" placeholder="Ej: 50" min="0" value="0" required>
    
    <button id="btnGuardar" onclick="guardarComponente()">Buscar y Guardar Componente</button>
    
    <div id="cargando" class="cargando">⏳ Consultando a la API de Octopart... por favor espera.</div>
    <div id="mensaje" class="mensaje"></div>
</div>

<script>
    async function guardarComponente() {
        const mpn = document.getElementById("mpn").value;
        const nombre = document.getElementById("nombre").value;
        const stock = document.getElementById("stock").value;
        const btn = document.getElementById("btnGuardar");
        const divCargando = document.getElementById("cargando");
        const divMensaje = document.getElementById("mensaje");

        if(!mpn || !nombre) { alert("Por favor llena el MPN y el Nombre."); return; }

        btn.disabled = true;
        divMensaje.style.display = "none";
        divCargando.style.display = "block";

        try {
            const respuesta = await fetch("https://electro-api-backend.onrender.com/agregar_componente_web", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ mpn: mpn, nombre: nombre, stock: parseInt(stock) })
            });
            const data = await respuesta.json();
            
            divCargando.style.display = "none";
            divMensaje.style.display = "block";
            
            if(respuesta.ok) {
                divMensaje.className = "mensaje exito";
                divMensaje.innerText = "✅ " + data.mensaje;
                document.getElementById("mpn").value = "";
                document.getElementById("nombre").value = "";
                document.getElementById("stock").value = "0";
            } else {
                divMensaje.className = "mensaje error";
                divMensaje.innerText = "❌ Error: " + data.detail;
            }
        } catch (error) {
            divCargando.style.display = "none";
            divMensaje.style.display = "block";
            divMensaje.className = "mensaje error";
            divMensaje.innerText = "❌ Error de conexión con el servidor.";
        }
        btn.disabled = false;
    }
</script>
</body>
</html>
